<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>單字王 03 測驗 - EngExam</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">

  <!-- Column -->
  <div class="d-flex flex-column min-vh-100">

    <!-- Appbar -->
    <nav class="navbar bg-body border-bottom sticky-top">
      <!-- Row: Brand + Spacing + Actions -->
      <div class="container d-flex align-items-center">
        <a class="navbar-brand fw-semibold" href="index.html">單字王 03 測驗</a>
        <div class="flex-grow-1"></div> <!-- Spacing -->
        <!-- Actions -->
        <div class="d-flex gap-2">
          <a href="keywordking_intro_03.html" class="btn btn-outline-primary btn-sm">單字</a>
          <a href="index.html" class="btn btn-outline-secondary btn-sm">離開</a>
        </div>
      </div>
    </nav>

    <!-- Content -->
    <main class="container flex-grow-1 py-4">
      <p class="text-secondary mb-4">直接在空格作答，完成後按最下方「交卷」批改。</p>

      <!-- 成績 -->
      <div id="result" class="d-none mb-4"></div>

      <form id="quiz" autocomplete="off" spellcheck="false">

        <!-- 第一部分 -->
        <div class="card mb-4">
          <div class="card-header fw-bold">第一部分：單字中翻英</div>
          <div class="card-body">
            <div class="row g-3" id="part1"></div>
          </div>
        </div>

        <!-- 第二部分 -->
        <div class="card mb-4">
          <div class="card-header fw-bold">第二部分：英文句子填空</div>
          <div class="card-body">
            <div class="alert alert-secondary">
              <p class="mb-2">從下列單字中選出最適合的填入空格，每個字只用一次。部分題目要改成複數、過去式等形態。</p>
              <div class="d-flex flex-wrap gap-1" id="wordBank"></div>
            </div>
            <ol class="list-group list-group-numbered" id="part2"></ol>
          </div>
        </div>

        <div class="d-grid gap-2 d-sm-flex justify-content-sm-end mb-3">
          <button type="button" class="btn btn-outline-secondary d-none" id="retryBtn">重新作答</button>
          <button type="submit" class="btn btn-primary btn-lg px-5" id="submitBtn">交卷</button>
        </div>
      </form>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ===== 題目 =====
const PART1 = [
  "陪審團；評審團", "潮濕的；濕氣", "適應；改編", "衣領；（動物的）項圈", "預見；預料", "啜泣；嗚咽", "慈善；慈善機構",
  "密集的；濃密的", "孤兒", "投資", "安靜；使安靜；噓", "口譯員", "發光；（臉）發紅；光輝", "負擔；重擔",
  "進步的；漸進的", "手鐲；手鍊", "面對；對抗", "潛力；潛在的", "出現；浮現", "解散；駁回；解僱", "方式；態度；（複數）禮貌"
];
const WORDS = ["hush","investment","glow","orphan","dense","foresee","bracelet","manner","adapt","jury","collar",
  "sob","potential","burden","emerge","confront","damp","interpreter","charity","dismiss","progressive"];
const PART2 = [
  "The fireflies ___ in the dark garden last night.",
  "Don't keep your books in the basement; it's too ___ down there.",
  "The judge thanked the ___ for their careful decision.",
  "Many young people find it hard to ___ to a new job.",
  "The boss ___ two workers yesterday for being late every day.",
  "He lost both parents in the war and grew up as an ___.",
  "Experts didn't ___ the sudden drop in oil prices.",
  "\"___! The baby is sleeping,\" Mom whispered.",
  "He gave his wife a diamond ___ for their anniversary.",
  "Taking care of a sick parent can be a heavy ___.",
  "The tourists needed an ___ because they couldn't speak Japanese.",
  "Real estate is a popular long-term ___.",
  "The dog's name and phone number are written on its ___.",
  "A rabbit suddenly ___ from the bushes while we were walking.",
  "The concert raised money for a children's ___.",
  "Teachers believe every student has the ___ to succeed.",
  "We got lost in the ___ forest because all the trees looked the same.",
  "The girl ___ quietly in her room after she fought with her best friend.",
  "He spoke in a friendly ___, so everyone felt relaxed.",
  "The new law is a ___ step toward equal pay for men and women.",
  "It takes courage to ___ a problem instead of ignoring it."
];

// ===== 解答：[可接受的答案..., 說明] =====
const KEY1 = [
  { accept: ["jury"], note: "" },
  { accept: ["damp"], note: "" },
  { accept: ["adapt"], note: "注意不要和 adopt（收養；採用）搞混" },
  { accept: ["collar"], note: "" },
  { accept: ["foresee"], note: "" },
  { accept: ["sob"], note: "" },
  { accept: ["charity"], note: "" },
  { accept: ["dense"], note: "" },
  { accept: ["orphan"], note: "" },
  { accept: ["investment"], note: "" },
  { accept: ["hush"], note: "" },
  { accept: ["interpreter"], note: "translator 偏筆譯，interpreter 是口譯" },
  { accept: ["glow"], note: "" },
  { accept: ["burden"], note: "" },
  { accept: ["progressive"], note: "" },
  { accept: ["bracelet"], note: "" },
  { accept: ["confront"], note: "" },
  { accept: ["potential"], note: "" },
  { accept: ["emerge"], note: "" },
  { accept: ["dismiss"], note: "" },
  { accept: ["manner", "manners"], note: "複數 manners 指「禮貌」" }
];
const KEY2 = [
  { accept: ["glowed"], note: "過去式（last night）" },
  { accept: ["damp"], note: "" },
  { accept: ["jury"], note: "" },
  { accept: ["adapt"], note: "adapt to 適應" },
  { accept: ["dismissed"], note: "過去式（yesterday），dismiss 在此為「解僱」" },
  { accept: ["orphan"], note: "母音開頭用 an" },
  { accept: ["foresee"], note: "didn't 後接原形" },
  { accept: ["hush"], note: "" },
  { accept: ["bracelet"], note: "" },
  { accept: ["burden"], note: "a heavy burden 沉重的負擔" },
  { accept: ["interpreter"], note: "母音開頭用 an" },
  { accept: ["investment"], note: "" },
  { accept: ["collar"], note: "" },
  { accept: ["emerged"], note: "過去式（while we were walking）" },
  { accept: ["charity"], note: "" },
  { accept: ["potential"], note: "have the potential to 有……的潛力" },
  { accept: ["dense"], note: "" },
  { accept: ["sobbed"], note: "過去式，要重複字尾 b" },
  { accept: ["manner"], note: "in a ... manner 以……的方式" },
  { accept: ["progressive"], note: "" },
  { accept: ["confront"], note: "" }
];

// ===== 產生題目 =====
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

$("part1").innerHTML = PART1.map((q, i) => `
  <div class="col-sm-6">
    <div class="input-group has-validation">
      <span class="input-group-text">${i + 1}. ${esc(q)}</span>
      <input type="text" class="form-control" id="p1-${i}" aria-label="${esc(q)}">
      <div class="invalid-feedback" id="p1-${i}-fb"></div>
    </div>
  </div>`).join("");

$("wordBank").innerHTML =
  WORDS.map(w => `<span class="badge text-bg-light border font-monospace fw-normal">${w}</span>`).join("");

$("part2").innerHTML = PART2.map((q, i) => {
  const [a, b] = q.split("___");
  return `
  <li class="list-group-item">
    <div class="d-inline-flex flex-wrap align-items-center gap-2">
      <span>${esc(a)}</span>
      <input type="text" class="form-control form-control-sm w-auto" id="p2-${i}" size="14">
      <span>${esc(b)}</span>
    </div>
    <div class="small mt-1 text-danger d-none" id="p2-${i}-fb"></div>
  </li>`;
}).join("");

// ===== 比對 =====
const norm = s => s.trim().toLowerCase().replace(/\s+/g, " ");

// 編輯距離，用來判斷是不是「拼錯」
function distance(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++)
    for (let j = 1; j <= b.length; j++)
      d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}

function check(answer, key) {
  const a = norm(answer);
  const correct = key.accept.includes(a);
  let reason = "";
  if (!correct) {
    if (!a) reason = "未作答";
    else if (key.accept.some(k => k.startsWith(a) || a.startsWith(k) || distance(a, k) <= 2)) reason = "拼字或字形錯誤";
  }
  return { correct, reason };
}

function markInput(input, ok) {
  input.classList.remove("is-valid", "is-invalid");
  input.classList.add(ok ? "is-valid" : "is-invalid");
}

function feedback(key, reason) {
  return [`正解：${key.accept.join(" / ")}`, key.note, reason].filter(Boolean).join("｜");
}

$("quiz").addEventListener("submit", e => {
  e.preventDefault();
  const wrong = [];
  let ok1 = 0, ok2 = 0;

  PART1.forEach((_, i) => {
    const input = $(`p1-${i}`), key = KEY1[i], r = check(input.value, key);
    markInput(input, r.correct);
    $(`p1-${i}-fb`).textContent = feedback(key, r.reason);
    r.correct ? ok1++ : wrong.push(key.accept[0]);
  });

  PART2.forEach((_, i) => {
    const input = $(`p2-${i}`), key = KEY2[i], r = check(input.value, key), fb = $(`p2-${i}-fb`);
    markInput(input, r.correct);
    fb.textContent = feedback(key, r.reason);
    fb.classList.toggle("d-none", r.correct);
    r.correct ? ok2++ : wrong.push(key.accept[0]);
  });

  const total = PART1.length + PART2.length;
  const score = Math.round((ok1 + ok2) / total * 100);
  const color = score >= 80 ? "success" : score >= 60 ? "warning" : "danger";
  const review = [...new Set(wrong)];

  $("result").innerHTML = `
    <div class="card border-${color}">
      <div class="card-body">
        <div class="d-flex flex-wrap align-items-baseline gap-3 mb-2">
          <span class="display-5 fw-bold text-${color}">${score}</span><span class="text-secondary">分</span>
          <span class="ms-auto text-secondary">第一部分 ${ok1}/${PART1.length}　第二部分 ${ok2}/${PART2.length}</span>
        </div>
        <div class="progress mb-3" role="progressbar"><div class="progress-bar bg-${color}" style="width:${score}%"></div></div>
        ${review.length
          ? `<h6 class="fw-bold">建議複習的單字</h6>
             <div class="d-flex flex-wrap gap-1">${review.map(w => `<span class="badge text-bg-danger fw-normal">${w}</span>`).join("")}</div>`
          : `<p class="mb-0 text-success fw-bold">全部答對，太棒了！</p>`}
      </div>
    </div>`;
  $("result").classList.remove("d-none");
  $("retryBtn").classList.remove("d-none");
  window.scrollTo({ top: 0, behavior: "smooth" });
});

$("retryBtn").addEventListener("click", () => {
  $("quiz").reset();
  document.querySelectorAll(".is-valid, .is-invalid").forEach(el => el.classList.remove("is-valid", "is-invalid"));
  document.querySelectorAll("[id^='p2-'][id$='-fb']").forEach(el => el.classList.add("d-none"));
  $("result").classList.add("d-none");
  $("retryBtn").classList.add("d-none");
  window.scrollTo({ top: 0, behavior: "smooth" });
});
</script>
</body>
</html>
